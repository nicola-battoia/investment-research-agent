[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "ipykernel==7.3.0",
    "openai==2.53.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.27.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.51",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[tool.pytest.ini_options]
markers = [
    "integration: calls live Supabase or OpenAI services",
]

[dependency-groups]
dev = [
    "lxml==6.1.1",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "tiktoken==0.13.0",
]
